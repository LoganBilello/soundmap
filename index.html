<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoundMap</title>
<style>
  :root {
    --bg: #04060c;
    --panel: rgba(9, 13, 22, 0.86);
    --line: rgba(255, 255, 255, 0.09);
    --line2: rgba(255, 255, 255, 0.16);
    --text: #e9edf6;
    --dim: #7f8aa3;
    --dimmer: #586075;
    --accent: #6fd3c7;
    --w: 380px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); overflow: hidden;
    font: 14px/1.55 "Inter", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #globe { position: fixed; inset: 0; cursor: grab; }
  #globe:active { cursor: grabbing; }

  /* Tooltip for the GPU dot layer, which has no DOM nodes of its own. */
  #tip {
    position: fixed; z-index: 8; pointer-events: none;
    background: rgba(6, 10, 18, .93); border: 1px solid var(--line2);
    border-radius: 6px; padding: 6px 9px; font-size: 12px; line-height: 1.45;
    opacity: 0; transition: opacity .12s; max-width: 240px;
  }
  #tip.show { opacity: 1; }
  #tip .d { color: var(--dim); }
  #tip .dd { color: var(--dimmer); }

  /* ---------------- panel ---------------- */
  #panel {
    position: fixed; top: 0; right: 0; width: var(--w); height: 100%;
    background: var(--panel); backdrop-filter: blur(16px);
    border-left: 1px solid var(--line);
    display: flex; flex-direction: column; z-index: 5;
  }
  #panel header { padding: 18px 22px 14px; border-bottom: 1px solid var(--line); }
  h1 {
    margin: 0; font-size: 15px; letter-spacing: .2em;
    text-transform: uppercase; font-weight: 600;
  }
  .sub { color: var(--dimmer); font-size: 11.5px; margin-top: 3px; font-variant-numeric: tabular-nums; }

  .searchwrap { position: relative; margin-top: 13px; }
  #search {
    width: 100%; padding: 9px 32px 9px 12px;
    background: rgba(255,255,255,.045); border: 1px solid var(--line);
    border-radius: 7px; color: var(--text); font: inherit; font-size: 13px;
    transition: border-color .15s;
  }
  #search:focus { outline: none; border-color: var(--accent); }
  #search::placeholder { color: var(--dimmer); }
  .slash {
    position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
    color: var(--dimmer); font-size: 10px; border: 1px solid var(--line2);
    border-radius: 4px; padding: 1px 5px; pointer-events: none;
  }
  #search:focus + .slash { display: none; }

  #bodywrap { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
  #body { padding: 16px 22px 28px; }
  #bodywrap::-webkit-scrollbar { width: 9px; }
  #bodywrap::-webkit-scrollbar-thumb { background: rgba(255,255,255,.13); border-radius: 5px; }
  #bodywrap::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.22); }

  .eyebrow {
    font-size: 10px; letter-spacing: .17em; text-transform: uppercase;
    color: var(--dimmer); margin: 20px 0 7px;
  }
  .eyebrow:first-child { margin-top: 0; }
  .place { font-size: 21px; font-weight: 600; margin: 0 0 2px; letter-spacing: -.01em; }
  .meta { color: var(--dim); font-size: 12px; }

  .chip {
    display: flex; align-items: center; gap: 9px; width: 100%;
    padding: 7px 10px; margin-bottom: 2px; border-radius: 6px;
    background: none; border: 0; color: var(--text);
    font: inherit; text-align: left; cursor: pointer;
    transition: background .12s;
  }
  .chip:hover { background: rgba(255,255,255,.065); }
  .chip.on { background: rgba(111,211,199,.15); }
  .chip:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .chip .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .cc { color: var(--dimmer); }
  .chip .w { margin-left: auto; color: var(--dimmer); font-size: 11px; font-variant-numeric: tabular-nums; padding-left: 8px; }

  .hint { color: var(--dim); font-size: 13px; line-height: 1.7; }
  .hint b { color: var(--text); font-weight: 600; }
  .hint kbd {
    background: rgba(255,255,255,.07); border: 1px solid var(--line2);
    border-radius: 4px; padding: 1px 5px; font: inherit; font-size: 11px; color: var(--text);
  }

  .stat {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px;
  }
  .stat span:first-child { color: var(--dim); }
  .stat span:last-child { font-variant-numeric: tabular-nums; }

  .origin {
    margin: 0 0 14px; padding: 12px 14px; border-radius: 8px;
    background: rgba(255,255,255,.04); border: 1px solid var(--line);
  }
  .origin-p { font-size: 17px; font-weight: 600; margin: 2px 0 3px; }
  .origin-w { font-size: 11.5px; color: var(--dim); }
  .badge {
    display: inline-block; font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase;
    border: 1px solid var(--line2); border-radius: 3px; padding: 1px 5px; color: var(--dim);
    margin-left: 6px; vertical-align: 1px;
  }

  button.play {
    width: 100%; margin: 13px 0 16px; padding: 11px;
    background: var(--accent); color: #04140f; border: 0; border-radius: 7px;
    font: 600 13.5px/1 inherit; cursor: pointer; transition: filter .12s;
  }
  button.play:hover { filter: brightness(1.09); }
  button.play.stop { background: rgba(255,255,255,.09); color: var(--text); }

  .back {
    background: none; border: 0; color: var(--accent); font: inherit; font-size: 12.5px;
    cursor: pointer; padding: 0; margin-bottom: 13px;
  }
  .back:hover { text-decoration: underline; }

  /* ---------------- now playing ---------------- */
  #np {
    position: fixed; left: 22px; bottom: 22px; z-index: 6;
    background: var(--panel); backdrop-filter: blur(16px);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 16px 13px; min-width: 210px; max-width: 330px;
    opacity: 0; transform: translateY(6px); pointer-events: none;
    transition: opacity .22s, transform .22s;
  }
  #np.show { opacity: 1; transform: none; }
  #np .t { font-weight: 600; display: flex; align-items: center; gap: 9px; font-size: 13.5px; }
  #np .s { color: var(--dim); font-size: 11.5px; margin-top: 3px; }
  #bar { height: 2px; background: rgba(255,255,255,.12); border-radius: 2px; margin-top: 9px; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: var(--accent); }
  .bars { display: inline-flex; gap: 2px; height: 13px; align-items: flex-end; flex: none; }
  .bars i { width: 3px; background: var(--accent); border-radius: 1px; animation: b .95s ease-in-out infinite; }
  .bars i:nth-child(2) { animation-delay: .16s } .bars i:nth-child(3) { animation-delay: .32s }
  @keyframes b { 0%,100% { height: 4px } 50% { height: 13px } }

  #credit {
    position: fixed; left: 22px; top: 20px; z-index: 5;
    color: var(--dimmer); font-size: 10.5px; line-height: 1.7; max-width: 330px;
  }
  #credit a { color: var(--dim); text-decoration: none; }
  #credit a:hover { color: var(--accent); }
  #credit .brand { color: var(--text); letter-spacing: .18em; font-weight: 600; font-size: 11px; }

  #loading {
    position: fixed; inset: 0; display: grid; place-items: center;
    z-index: 20; background: var(--bg); color: var(--dim); font-size: 13px;
  }

  @media (max-width: 860px) {
    :root { --w: 100%; }
    #panel { top: auto; bottom: 0; height: 52%; border-left: 0; border-top: 1px solid var(--line); }
    #credit, #np { display: none; }
  }
</style>
</head>
<body>
  <div id="globe"></div>
  <div id="tip"></div>

  <div id="credit">
    <span class="brand">SOUNDMAP</span><br>
    Genre taxonomy and clips from <a href="https://everynoise.com" target="_blank" rel="noopener">Every Noise at Once</a> by Glenn McDonald.<br>
    City listening data via the Internet Archive. Origins from
    <a href="https://musicbrainz.org" target="_blank" rel="noopener">MusicBrainz</a> (CC0).
    Coordinates from GeoNames (CC BY).
  </div>

  <div id="np">
    <div class="t"><span class="bars"><i></i><i></i><i></i></span><span id="np-name"></span></div>
    <div class="s" id="np-sub"></div>
    <div id="bar"><i></i></div>
  </div>

  <aside id="panel">
    <header>
      <h1>SoundMap</h1>
      <div class="sub" id="tagline">loading&hellip;</div>
      <div class="searchwrap">
        <input id="search" placeholder="Search a city or genre&hellip;" autocomplete="off" spellcheck="false">
        <span class="slash">/</span>
      </div>
    </header>
    <div id="bodywrap"><div id="body"></div></div>
  </aside>

  <div id="loading">building the globe&hellip;</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
